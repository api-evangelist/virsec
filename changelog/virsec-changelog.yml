- version: 3.1.1-P3
  date: '2025-12-08'
  channel: GA
  url: https://docs.virsec.com/docs/patch-311-p3-ga-v2-1
  breaking: false
  summary: Targeted priority patch. Virsec recommends customers on 3.1.1-P2 remain on
    that version unless they need these specific fixes.
  highlights:
  - Per-host-profile control of Closed Loop ACP (CLACP), so autonomous protection can
    be enabled selectively per host profile.
  - Improved LOLBIN command-line pattern database for better regex detection accuracy.
  - Linux kernel driver now reads a configuration file to exclude specific protected
    processes from injection, improving compatibility with third-party EDR tools.
  - Fixed File System Reconciliation (FSR) scans on Linux U22 producing empty package
    list entries.
  - Extended Windows package scanning to cover additional operating-system packages.
