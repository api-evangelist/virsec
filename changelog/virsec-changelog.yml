- version: 3.1.0
  date: '2024-09-03'
  channel: GA
  url: https://docs.virsec.com/docs/release-notes-310
  breaking: false
  summary: Introduces Trust Blade Engines and the Trust Score, plus the TrustSight
    insight surface and Closed Loop ACP.
  highlights:
  - 'Trust Score — a 1..100 application trust metric computed as a multiplier of
    Provenance, Integrity and Authorization across packaged and non-packaged code on a
    workload.'
  - 'TrustSight widgets: Topology (workload map, with manual CMDB ingest), System
    Integrity, Vulnerability Compensation, and Know Your Software.'
  - Closed Loop ACP — benign LOLBins are auto-added as ACP rules and their incidents
    auto-acknowledged, reducing false positives; BUA (Block Unless Allowlisted) rules
    applied to all platform LOLBins.
  - MEP Configuration Utility — audit utility to run before enabling Memory Exploit
    Protection where an EDR or other hooking agent is active on the workload.
- version: 3.0.0
  date: '2024-04-12'
  channel: GA
  url: https://docs.virsec.com/docs/release-notes-300-ga
  breaking: false
  api_relevant: true
  summary: CMS becomes available as a Virsec-managed SaaS instance, and Global
    Allowlists become API-addressable.
  highlights:
  - 'API: Global Allowlists can now be defined through APIs, allowlisting executables
    across profiles.'
  - CMS as a SaaS instance — removes the on-prem infrastructure requirement;
    installation, upgrade and migration handled by the Virsec team. A SaaS CMS instance
    supports 1500 associated probes.
  - Migrating CMS from 2.x on-prem to 3.x SaaS requires probes to be upgraded to 3.x,
    deployable with or without a proxy server.
  - Host and Buffer Exploit Protection support for RHEL 6.x (64-bit) virtual machines.
  - Granular custom-condition exceptions for Web Protection incidents.
  - Host Protection uses a kernel cache for executables to optimize detection and
    protection response time.
- version: '2.11'
  date: '2023-10-31'
  channel: LA
  url: https://docs.virsec.com/docs/release-notes-211
  breaking: false
  api_relevant: true
  summary: The release that added the write side of the CPM API and deprecated the
    fan-out log/stats/data endpoints.
  highlights:
  - 'API: Install Probe, Upgrade Probe, Uninstall Probe, Install Script and vsp-cli
    Command APIs introduced.'
  - 'API deprecation: GET /rms/fetch/log/all, /rms/fetch/stats/all and
    /rms/fetch/data/all deprecated in favour of per-probe and probeSet forms.'
  - Web Protection support for .NET 5, 6 and 7; Host and Memory Exploit Protection on
    RHEL 9.
  - Improved reflected and stored XSS detection algorithm.
  - ACP enforcement extended to scripts and commands run from Windows interpreters
    (PowerShell, command prompt).
  - Incidents can be filtered to include/exclude specific hosts, and filters can be
    saved.
