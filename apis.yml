aid: virsec
name: Virsec
description: 'Virsec Systems is a San Jose, California cybersecurity company that builds
  the Virsec Security Platform (VSP), a deny-by-default, allow-on-trust zero trust runtime
  defense for cloud and legacy server workloads. VSP combines host protection, memory
  exploit protection and web protection with a Centralized Management Server (CMS) and
  distributed Probes, stopping ransomware, remote code execution, living-off-the-land
  and zero-day attacks at runtime without patching. The platform is customer-deployed
  (on-prem VM, EC2/Azure/GCP, Kubernetes/Helm or SaaS CMS) and exposes a customer-facing
  REST surface: a CMS API reference served from the CMS console under Help > API
  Documentation, the Centralized Probe Management (CPM) API under /rms for probe
  install, upgrade, migration, log/stat/data collection and vsp-cli execution, and
  configurable outbound webhooks that push detected incidents into existing SIEM,
  ITSM and ticketing systems (QRadar, Splunk, Syslog, Zendesk).'
