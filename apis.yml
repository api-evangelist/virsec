apis:
- aid: virsec-cms-api
  name: Virsec Security Platform CMS API
  description: 'The Virsec Security Platform Centralized Management Server (CMS) exposes
    a RESTful API for procuring information from CMS. From VSP 3.0.0 and above, the
    available APIs are listed by category in the CMS console under Help > API
    Documentation, where each API lists its base URL and required parameters and can be
    executed interactively; the bearer token used is the OAuth token obtained from
    Access Management. The CMS is customer-deployed, so the base URL is the customer''s
    own CMS host rather than a shared multi-tenant endpoint.'
  humanURL: https://docs.virsec.com/docs/available-apis
  baseURL: https://{cms_host}
  tags:
  - Security
  - Workload Protection
  - Management
  properties:
  - type: Documentation
    url: https://docs.virsec.com/docs/available-apis
  - type: APIReference
    url: https://docs.virsec.com/docs/available-apis
  - type: Authentication
    url: authentication/virsec-authentication.yml
- aid: virsec-cpm-api
  name: Virsec Centralized Probe Management (CPM) API
  description: 'The Centralized Probe Management (CPM) API simplifies upgrade and
    troubleshooting of VSP Probes deployed across application platforms. Served from
    the customer''s CMS host under /rms, it covers probe inventory, log/statistics/data
    collection, log-level modification per module, file download, command history,
    probe install/upgrade/uninstall/migrate, CPM self-upgrade, script installation,
    remote vsp-cli execution and VSP service start/stop. Requests use HTTP Basic
    authentication with Super Admin credentials; the API is compatible with CMS and
    Probes from VSP 2.9 and above, with install/upgrade/uninstall/script/vsp-cli
    operations added in 2.11 and migrate/self-upgrade/service in 3.0.0.'
  humanURL: https://docs.virsec.com/docs/cpm-apis
  baseURL: https://{cms_host}/rms
  tags:
  - Security
  - Workload Protection
  - Agent Management
