generated: '2026-08-05'
method: searched
source: https://docs.virsec.com/docs/cpm-apis
description: Versioning, deprecation and support posture for the Virsec Security
  Platform (VSP) API surface. VSP is customer-deployed software rather than a hosted
  multi-tenant API, so the API lifecycle is bound to the product release train, not to
  a URI or header version.
versioning:
  scheme: product-release
  style: semantic product versions (major.minor.patch, with LA/GA and -Pn patch
    qualifiers) applied to the platform as a whole
  current: 3.1.1-P3
  current_release_date: '2025-12-08'
  api_version_in_url: false
  api_version_header: false
  docs: https://docs.virsec.com/docs/release-notes-310
  note: The API reference gates each operation on the product release that introduced
    it rather than versioning the endpoint path. Callers must reconcile the CMS and
    Probe versions in their estate against the operation they intend to call.
capability_gates:
- version: 2.9 and above
  applies_to: CPM API baseline (probe inventory, log/statistics/data collection, log
    level modification, download, command history) — compatible across CMS and Probes
- version: 2.11 and above
  applies_to: Install Probe, Upgrade Probe, Uninstall Probe, Install Script, vsp-cli
    Command
- version: 3.0.0 and above
  applies_to: Migrate Probe (on-prem to SaaS CMS), CPM Self Upgrade, Service Command
    (start/stop VSP services), Global Allowlist APIs; CMS also becomes available as a
    SaaS instance
- version: 3.1.0 and above
  applies_to: Trust Score / TrustSight, Closed Loop ACP, MEP Configuration Utility
deprecation:
  policy_url: https://docs.virsec.com/docs/cpm-apis
  policy_published: false
  sunset_header: false
  deprecation_header: false
  style: inline in-reference annotation — operations are marked "[Deprecated from VSP
    <version> onwards]" in the API reference table, with the replacement endpoint
    documented alongside.
  note: There is no separate deprecation-policy page, no advance-notice window, and no
    RFC 8594 Sunset/Deprecation header support. Deprecation is announced in the
    reference and in release notes only.
deprecated_operations:
- operation: GET /rms/fetch/log/all
  deprecated_from: VSP 2.11
  replacement: GET /rms/fetch/log/{probeid} or POST /rms/fetch/log with a probes[] body
  source: https://docs.virsec.com/docs/cpm-apis
- operation: GET /rms/fetch/stats/all
  deprecated_from: VSP 2.11
  replacement: GET /rms/fetch/stats/{probeid} or POST /rms/fetch/stats with a probes[]
    body
  source: https://docs.virsec.com/docs/cpm-apis
- operation: GET /rms/fetch/data/all
  deprecated_from: VSP 2.11
  replacement: GET /rms/fetch/data/{probeid} or POST /rms/fetch/data with a probes[]
    body
  source: https://docs.virsec.com/docs/cpm-apis
